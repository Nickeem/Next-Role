services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-next_role}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-next_role}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      NEXT_ROLE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-next_role}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-next_role}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      NEXT_ROLE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-next_role}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-next_role}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Publishes queued notifications and postponed-review reminders. Same image as the API;
  # idle unless NEXT_ROLE_NTFY_ENABLED=true.
  worker:
    build: .
    command: ["python", "-m", "next_role.worker"]
    env_file: .env
    environment:
      NEXT_ROLE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-next_role}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-next_role}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "next_role.worker", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
